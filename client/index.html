<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#911A1C" />
    <title>Viannes Bistro — A Delicious Journey</title>

    <!-- Fork-and-spoon mark on a cream disc with an orange ring. -->
    <link rel="icon" href="/brand/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/brand/icon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The hero photograph is preloaded: it is the largest above-the-fold
         paint on the shop. imagesrcset/imagesizes MUST mirror the <img> in
         components/Hero.jsx exactly, or the browser preloads one candidate and
         then downloads a different one. Widths come from the pipeline manifest
         (src/data/photoManifest.json) — this shot caps at 1007px. -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/photos/opt/club-sandwich-800.webp"
      imagesrcset="/photos/opt/club-sandwich-480.webp 480w, /photos/opt/club-sandwich-800.webp 800w, /photos/opt/club-sandwich-1007.webp 1007w"
      imagesizes="(max-width: 767px) 90vw, 530px"
    />
    <!-- Only the display face is preloaded: it sets the hero headline, which is
         above the fold. Poppins and Inter load normally with swap. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap"
    />
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&display=swap" rel="stylesheet" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
